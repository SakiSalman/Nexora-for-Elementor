<!-- 12 CASE STUDIES -->
<section id="cases" class="sec" style="background: #FFFFFF">
<script type="application/json" class="ph-cases-data">__PH_CASES_JSON__</script>
<div class="wrap" style="display: flex; flex-direction: column; gap: 44px">
<div class="head center reveal" style="max-width: 820px"><span class="tag blue">Case studies</span><h2 class="h2">See how businesses grow <span class="grad-text">with Prospects Hive</span></h2></div>
<article class="stack-sm reveal" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch">
<div class="card" style="padding: 40px; display: flex; flex-direction: column; gap: 18px">
<span class="chip o" style="align-self: flex-start">Featured case</span>
<h3 style="font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">{{ cs.title }}</h3>
<p class="muted" style="font-size: 16.5px; line-height: 1.7">{{ cs.summary }}</p>
<a class="btn btn-case sheen" href="{{ cs.buttonUrl }}" target="{{ cs.buttonTarget }}" rel="{{ cs.buttonRel }}" style="align-self: flex-start; height: 48px; font-size: 15px">{{ cs.buttonText }} <svg class="btn-arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>
<dl style="margin: auto 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 20px; padding: 13px 0; border-top: 1px solid #F0E8DF; font-size: 14.5px"><dt class="muted">Client</dt><dd style="margin: 0; font-weight: 500; text-align: right">{{ cs.client }}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 20px; padding: 13px 0; border-top: 1px solid #F0E8DF; font-size: 14.5px"><dt class="muted">Industry</dt><dd style="margin: 0; font-weight: 500; text-align: right">{{ cs.industry }}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 20px; padding: 13px 0; border-top: 1px solid #F0E8DF; border-bottom: 1px solid #F0E8DF; font-size: 14.5px"><dt class="muted">Services</dt><dd style="margin: 0; font-weight: 500; text-align: right">{{ cs.services }}</dd></div>
</dl>
</div>
<div class="mid" style="position: relative; border-radius: 28px; overflow: hidden; min-height: 460px; box-shadow: 0 40px 80px -40px rgba(11,22,32,.6); display: flex; flex-direction: column">
<sc-if value="{{ cs.hasImg }}" hint-placeholder-val="{{ true }}">
<img src="{{ cs.img }}" alt="{{ cs.alt }}" style="display: block; width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0">
</sc-if>
<sc-if value="{{ cs.noImg }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; padding: 40px; display: flex; flex-direction: column; gap: 20px; height: 100%"><span class="tag" style="align-self: flex-start">Case study</span><h3 style="font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">{{ cs.title }}</h3></div>
</sc-if>
<div class="glass-d" style="position: absolute; left: 20px; right: 20px; bottom: 20px; padding: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); background: rgba(11,22,32,.55)">
<sc-for list="{{ cs.stats }}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px"><span class="grad-text" style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1">{{ s.v }}</span><span style="font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9D3DC">{{ s.l }}</span></div>
</sc-for>
</div>
</div>
</article>
<div style="display: flex; justify-content: center; align-items: center; gap: 14px">
<button class="arrowbtn" aria-label="Previous case study" onClick="{{ prevCase }}">←</button>
<sc-for list="{{ caseDots }}" as="d" hint-placeholder-count="3"><button class="{{ d.cls }}" aria-label="{{ d.label }}" onClick="{{ d.pick }}"></button></sc-for>
<button class="arrowbtn" aria-label="Next case study" onClick="{{ nextCase }}">→</button>
</div>
</div>
</section>
