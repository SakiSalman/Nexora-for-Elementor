<!-- 8 GTM IMPACT -->
<section class="sec" style="background: var(--ph-surface, #FFFFFF)">
<script type="application/json" class="ph-impact-data">__PH_IMPACT_JSON__</script>
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<div class="head reveal" style="max-width: 820px"><span class="tag blue">GTM impact</span><h2 class="h2">More than lead generation: the impact of a <span class="grad-text">connected GTM system</span></h2></div>
<div role="tablist" aria-label="Impact areas" class="glass tabs-scroll" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; align-self: flex-start">
<sc-for list="{{ impactTabs }}" as="t" hint-placeholder-count="5">
<button role="tab" class="{{ t.cls }}" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="border: none">{{ t.label }}</button>
</sc-for>
</div>
<div role="tabpanel" class="stack-sm" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch">
<div class="reveal" style="position: relative; border-radius: 28px; overflow: hidden; background: var(--ph-ink, #0B1620); box-shadow: 0 40px 80px -40px color-mix(in srgb, var(--ph-ink, #0B1620) 60%, transparent)">
<img src="{{ impact.image }}" alt="{{ impact.alt }}" style="display: block; width: 100%; height: 100%; object-fit: cover">
<span class="glass-d" style="position: absolute; left: 18px; bottom: 18px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ph-on-dark, #FFFFFF)">{{ impact.label }}</span>
</div>
<div class="reveal imp-frame" style="border-radius: 28px; padding: 3px">
<div class="imp-panel" style="height: 100%; border-radius: 25px; padding: 38px; display: flex; flex-direction: column; gap: 18px">
<h3 style="font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">{{ impact.title }}</h3>
<p class="muted" style="font-size: 16.5px; line-height: 1.7">{{ impact.body }}</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ impact.points }}" as="pt" hint-placeholder-count="4">
<li style="display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.5"><span class="check">✓</span>{{ pt }}</li>
</sc-for>
</ul>
</div>
</div>
</div>
</div>
</section>
